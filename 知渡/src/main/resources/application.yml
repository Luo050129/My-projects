server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: zhidu
  profiles:
    active: local

  # Jackson 时间格式统一
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 全局校验失败直接抛 MethodArgumentNotValidException（由全局异常处理器收敛）
  mvc:
    throw-exception-if-no-handler-found: true

  # 上传体积限制：默认只有 1MB，不调会导致稍大的截图直接被容器拒掉
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # 数据库迁移：Flyway 是表结构的唯一真相源，替代原先 spring.sql.init 的
  # CREATE TABLE IF NOT EXISTS + ALTER IF NOT EXISTS（后者在 MySQL 下无法重复执行）。
  # baseline-on-migrate 让已存在的老库（data/community.mv.db）打上 V1 基线，
  # 只叠加 V2+；全新库则正常从 V1 开始执行。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

# 可观测性：必须是顶层 management。
# 曾误写在 spring: 之下变成 spring.management.*，Boot 静默忽略，
# 实际只暴露了默认的 health 一个端点（启动日志 "Exposing 1 endpoint"）。
# 不暴露 env：该端点可能泄露配置值，非必要不开放。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

community:
  # 跨源白名单：不再用 allowedOriginPatterns("*") + allowCredentials(true)，
  # 生产必须通过 CORS_ALLOWED_ORIGINS 显式注入，多个用逗号分隔。
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  jwt:
    # 演示用密钥，仅限 local/test；prod 必须通过环境变量注入（见 .env.example）
    secret: ${JWT_SECRET:lxb-community-demo-secret-key-please-change-me-2026}
    expiration-minutes: 120
  storage:
    # 本地上传目录（相对进程工作目录）；生产可替换为对象存储实现
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    # 对外访问前缀，必须与 server.servlet.context-path 一致
    public-prefix: /api/uploads
    max-size-bytes: 5242880
  ai:
    enabled: true
    provider: deepseek
    base-url: https://api.deepseek.com
    # 优先读环境变量 DEEPSEEK_API_KEY；留空则启用规则降级实现，保证离线可跑
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    timeout-seconds: 20

# 接口文档：仅 dev/test 开放，prod 在 application-prod.yml 中关闭
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
