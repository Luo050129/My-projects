spring:
  datasource:
    # 内存 H2，保证测试之间互相隔离、不依赖本地文件库
    url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1

community:
  mq:
    type: local
  ai:
    enabled: true
    api-key: ""   # 测试走规则降级
