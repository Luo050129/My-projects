name: 知渡 CI

# 仓库根在「合集」，知渡是子项目；路径过滤避免其它项目改动触发本流水线。
on:
  push:
    paths:
      - '知渡/**'
      - '.github/workflows/zhidu.yml'
  pull_request:
    paths:
      - '知渡/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 后端编译、迁移与测试
        working-directory: 知渡
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vue 前端构建
        working-directory: 知渡/frontend
        run: npm ci && npm run build
      - name: React 前端构建
        working-directory: 知渡/frontend-react
        run: npm ci && npm run build
